name: Deploy
# Runs only after CI succeeded on main and deploys the exact build artifact that CI tested.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  deploy:
    name: Deploy
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-donatr
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - run: tar -xf build.tar
      - uses: Koeroesi86/deploy-action@v1
        with:
          host: ${{ vars.DEPLOY_HOST }}
          user: ${{ vars.DEPLOY_USER }}
          path: /var/www/donatr.eu
          source: build
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          pre-activate: node -e "require('./serverConfig.js')"
          health-url: https://donatr.eu/
